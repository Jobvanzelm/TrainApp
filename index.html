<body>

<h1>Train App v0.0.2</h1>
<div id="trains-select-container">
    <select id="trains" selected="None" class="yeah">        
        <option>167990 | NYC | Boxcar</option>
        <option>77140 | NYC| Boxcar</option>
        <option>92101 | NYC | Boxcar</option>
        <option>Herb-1 | Herbie | Boxcar</option>
        <option>1237 | MNS | Boxcar</option>
        <option>24616 | NP | Boxcar</option>
        <option>24782 | NP | Boxcar</option>
        <option>112011 | PRR | Boxcar</option>
        <option>112018 | PRR | Boxcar</option>
        <option>112025 | PRR | Boxcar</option>
        <option>112027 | PRR | Boxcar</option>
        <option>1999 | Smokey Bear | Boxcar</option>
        <option>77409 | ACL | Flatcar</option>
        <option>454764 | Reefer</option>
        <option>1717 | PFE | Reefer</option>
        <option>1728 | SF | Reefer</option>
        <option>1739 | SF | Reefer</option>
        <option>1740 | SF | Reefer</option>
        <option>156 | NP | Reefer</option>
        <option>11258 | NYC MDT | Reefer</option>
        <option>22602 | NYC MDT | Reefer</option>
        <option>5100 | Tivoli Beer | Reefer</option>
        <option>39829 | DODX | DCFC</option>
    </select>

    <button onclick="addTrainSelect()">Add Train</button>
</div>

<button onclick="generate()">Generate</button>

<table id="result-table">
    <thead>
        <tr>            
            <th>Car</th>
            <th>Destination</th>
        </tr>
    </thead>
    <tbody id="result-table-body">
    </tbody>
</table>
</body>
</html>

<script>    
    $(document).ready(function() {
        trainCount = 6
        for (var i = 0; i < trainCount; i++) {
            addTrainSelect();
        }
        
        let trainCounter = document.getElementById('train-counter')
        trainCounter.textContent = `${trainCount} trains`
    });

    // TODO: maybe an init function that creates 7 selects... hmmmm
    function addTrainSelect() {
        // hoi Oscar
        // TODO: add select at the end and not front
        // what if: pass ID as a parameter, then get THAT specific select. then delete the option that that select has selected.
        let trainSelect = document.getElementById('trains')
        let newTrainSelect = trainSelect.cloneNode(true)
        newTrainSelect.id = 'trainselectclone'
        trainSelect.after(newTrainSelect)
    }

    function generate() {
        // clear existing table rows
         document.querySelectorAll('.lmao').forEach(element => element.remove())
         
        let selects = document.getElementsByClassName('yeah')
        let boxcarTrains = []
        let reeferTrains = []

        var boxcarDestinations = [1,2,3,4,5,6,7,9]
        var reeferDestinations = [1,2,3,4,5]

        let boxcarTrainsWithDestinations = []
        let reeferTrainsWithDestinations = []

        let trainNames = ''
        let specialCase = false
        const tableBody = document.getElementById("result-table-body")
        // There might be a more elegant way to split the trains but I don't care. If I'm gonna do fancy stuff I'll just build it in typescript
        for (const select of selects) {
            if (select.value.endsWith('Boxcar') || select.value.endsWith('Flatcar')) {
                boxcarTrains.push(select.value)
            }
            else if (select.value.endsWith('Reefer')) {
                reeferTrains.push(select.value)
            }
            else {
                console.log('WAT')
                specialCase = true
            }
        }
        // certain cars have a dedicated destination, make sure to remove it from the available destinations after this
        if (specialCase) {
            boxcarTrainsWithDestinations.push({
                "train": '39829 | DODX | DCFC',
                "destination": 8
            })
        }
        else {
            // add 8 to boxcar trains so it's available for other cars
            // Yes I figured it'd be easier to make the spot available AFTER we decide we don't need it for the special case instead of removing it later because I am lazy
            // except now if you regenerate the 8 is still there oops
            boxcarDestinations.push(8)
        }

        // Thank you w3schools https://www.w3schools.com/js/js_array_sort.asp
        boxcarDestinations.sort(function(){return 0.5 - Math.random()})
        reeferDestinations.sort(function(){return 0.5 - Math.random()})

        // create an object for each reefer car
        for (var i = 0; i < reeferTrains.length; i++) {       
            reeferTrainsWithDestinations.push({
                "train": reeferTrains[i],
                "destination": reeferDestinations[i]
            })
        }

        // sort by destination
        reeferTrainsWithDestinations.sort(function(a, b) {return a.destination - b.destination})

        // add to table
        for (const reeferTrainsWithDestination of reeferTrainsWithDestinations) {            
            var row = tableBody.insertRow()
            row.classList.add('lmao')
            var trainCell = row.insertCell()
            var destinationCell = row.insertCell()

            trainCell.textContent = reeferTrainsWithDestination.train
            destinationCell.textContent = reeferTrainsWithDestination.destination
        }

        for (var i = 0; i < boxcarTrains.length; i++) {       
            boxcarTrainsWithDestinations.push({
                "train": boxcarTrains[i],
                "destination": boxcarDestinations[i]
            })
        }

        // sort by destination
        boxcarTrainsWithDestinations.sort(function(a, b) {return a.destination - b.destination})

        for (const boxcarTrainsWithDestination of boxcarTrainsWithDestinations) {            
            var row = tableBody.insertRow()
            row.classList.add('lmao')
            var trainCell = row.insertCell()
            var destinationCell = row.insertCell()

            trainCell.textContent = boxcarTrainsWithDestination.train
            destinationCell.textContent = boxcarTrainsWithDestination.destination
        }
    }

</script>
